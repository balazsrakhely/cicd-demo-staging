# .github/workflows/secrets.yml
# A secret is masked in the log wherever it appears, even if you try to print it.
# Masking is not security: it is a safety net for accidents. The real rule is
# that a secret is only ever read by the step that needs it.
name: Secrets

on: workflow_dispatch

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: Try to print it
        run: echo "the secret is ${{ secrets.DEMO_SECRET }}"

      - name: Try harder
        env:
          S: ${{ secrets.DEMO_SECRET }}
        run: |
          echo "via env: $S"
          echo "reversed, so masking cannot see it: $(echo -n "$S" | rev)"

      - name: What a job can do to the repo
        run: echo "${{ toJSON(github.event_name) }} ${{ github.repository }}"
