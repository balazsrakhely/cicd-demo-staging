# .github/workflows/secrets.yml
# What a secret does, and what it does not do.
#
# GitHub replaces a secret's exact text with *** wherever it appears in a log.
# That is a safety net for accidents, not a security boundary: it is literal
# string matching, so anything that changes the bytes defeats it. The third
# step below prints the secret reversed and it comes out in clear.
#
# The real rule: only the step that needs a secret reads it, and no step ever
# prints one. Anyone who can change a workflow in a repo can read every secret
# that workflow is allowed to read.
name: Secrets

on: workflow_dispatch

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: Try to print it
        run: echo "the secret is ${{ secrets.DEMO_SECRET }}"

      - name: Try harder
        env:
          S: ${{ secrets.DEMO_SECRET }}
        run: |
          echo "via env: $S"
          echo "reversed, so masking cannot see it: $(echo -n "$S" | rev)"

      - name: Which event, which repo
        run: echo "${{ github.event_name }} on ${{ github.repository }}"
