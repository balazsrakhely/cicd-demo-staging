# .github/workflows/build-push.yml
# Does from CI exactly what lesson 01 did by hand: tag the image with its full
# ghcr.io address and push it. No personal access token anywhere.
name: Build and push

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # GITHUB_TOKEN is minted for this run and dies with it. It is read-only on
    # contents by default and cannot write packages unless you say so here.
    # Narrow beats broad: everything not listed is `none`.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out the tags and labels for us. `github.repository` is
      # owner/repo, so the image name follows the repo wherever it is forked.
      # Only a commit-SHA tag here, never `latest`: lesson 01's rule.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest comes from the BUILD step. metadata-action's `version`
      # output is the primary tag, not a digest — printing that as "digest:"
      # is a mistake you will believe for months.
      - name: Show what was pushed
        run: |
          echo "tags:   ${{ steps.meta.outputs.tags }}"
          echo "digest: ${{ steps.build.outputs.digest }}"
