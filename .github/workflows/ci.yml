# .github/workflows/ci.yml — second version. Three jobs.
#
#   test ──────> e2e        (e2e needs the image test built)
#   parallel-demo           (needs nothing, so it starts at the same moment)
#
# Nothing here pushes an image anywhere. CI answers one question: may this
# pull request be merged?
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - run: go test -v ./...

      # A tag that exists only inside this run. It never reaches a registry.
      - name: Build the image
        run: docker build -t hello:ci .

      # Jobs run on separate machines, so the e2e job cannot see this image.
      # An artifact is the post box between them: a file, uploaded here and
      # downloaded there.
      - name: Pack the image into a file
        run: docker save hello:ci -o image.tar

      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.tar
          retention-days: 1

  e2e:
    needs: test               # waits for test, and is skipped if test fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: image

      - uses: helm/kind-action@v1
        with:
          cluster_name: hello

      # The image never existed in a registry, so it is side-loaded into the
      # cluster's own node. Kubernetes finds it there and pulls nothing.
      - name: Load the image into the cluster
        run: kind load image-archive image.tar --name hello

      - name: Point the Deployment at the image we just built
        run: |
          sed -i 's|image: .*|image: hello:ci|' k8s/deployment.yaml
          grep 'image:' k8s/deployment.yaml

      - run: kubectl apply -f k8s/

      # The startup probe has to pass before a Pod counts as ready, so this
      # wait is the probes from session 1 doing their job.
      - name: Wait for the rollout
        run: kubectl rollout status deploy/hello --timeout=90s

      - name: Ask the Service for /healthz
        run: |
          kubectl port-forward svc/hello 8080:80 &
          sleep 3
          curl --fail --silent --show-error --retry 5 --retry-connrefused \
            http://localhost:8080/healthz
          curl --fail --silent http://localhost:8080/

      # `if: always()` runs the step whatever happened above, so a red run
      # explains itself in its own log — the cluster is gone by the time you
      # read it.
      - name: What the cluster thinks, pass or fail
        if: always()
        run: |
          kubectl get pods -o wide
          kubectl get endpointslices
          kubectl describe deploy/hello | tail -20
          kubectl describe pods | grep -A5 -E 'Events:' || true

  # This job does nothing useful. It is here to be watched: it has no
  # `needs:`, so it starts at the same moment as test, on its own machine,
  # and counts to three while test and e2e are still going.
  parallel-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Count to three
        run: |
          for i in 1 2 3; do
            echo "step $i, while the other jobs are still running"
            sleep 5
          done

      # A step-level `if` on the event: this line is useful on a pull request
      # and meaningless on a manual run, so it only runs on the one.
      - name: Which pull request is this
        if: github.event_name == 'pull_request'
        run: echo "PR number ${{ github.event.number }} wants to merge into ${{ github.base_ref }}"
