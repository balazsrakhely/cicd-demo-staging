# .github/workflows/release.yml
# Same build as build-push.yml, different question: what do humans call this
# version? A git tag is the answer, so a git tag is the trigger.
name: Release

on:
  push:
    # v[0-9]* and not v*: metadata-action's semver patterns produce no tags at
    # all for something like `v-wip`, and build-push-action with an empty tag
    # list fails in a way that takes ten minutes to understand.
    tags: ['v[0-9]*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # From the tag v0.2.0 this produces three image tags: 0.2.0, 0.2 and 0.
      # Still no `latest`. Moving names are what lesson 01 warned about, and
      # `0.2` moves on the next patch release by design — the fully pinned
      # 0.2.0 is the one a Deployment should name.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Without this, the action's default (latest=auto) adds a `latest`
          # tag as soon as any semver tag is produced — so a workflow that
          # never mentions `latest` publishes one anyway.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
